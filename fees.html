<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>收費標準｜衣博士龜山十巷店</title>
  <link rel="icon" href="images/logo_01.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>
        <a class="logo-mark" href="index.html">
          <img src="images/logo_01.png" alt="衣博士洗衣連鎖">
          <span class="store-name">衣博士龜山十巷店<small>DR. WASHING LAUNDROMAT</small></span>
        </a>
      </h1>

      <div class="header-actions" style="display: flex; align-items: center; gap: 15px;">
        <select class="lang-selector" onchange="changeLanguage(this.value)" style="background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.3); border-radius:6px; padding:6px 10px; font-family:inherit; cursor:pointer; font-size: 0.9rem; outline: none;">
          <option value="zh" style="color: #000;">繁體中文</option>
          <option value="en" style="color: #000;">English</option>
          <option value="vi" style="color: #000;">Tiếng Việt</option>
          <option value="th" style="color: #000;">ภาษาไทย</option>
          <option value="id" style="color: #000;">Bahasa Indonesia</option>
        </select>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="開啟選單">☰</button>
      </div>

      <nav id="nav-menu">
        <ul>
          <li><a href="index.html" data-i18n="nav_home">首頁</a></li>
          <li><a href="fees.html" class="current" data-i18n="nav_fees">收費標準</a></li>
          <li><a href="VM.html" data-i18n="nav_vm">自助購買</a></li>
          <li><a href="call_me.html" data-i18n="nav_contact">聯絡我們</a></li>
          <li><a href="https://www.184.com.tw/" data-i18n="nav_brand">品牌介紹</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="section-head">
        <span class="eyebrow">Machine Rates</span>
        <h2 data-i18n="fees_title">收費標準</h2>
        <p data-i18n="fees_desc">各機型如同店內的跳表顯示，價格一目了然。</p>
      </div>

      <div class="meter-grid">
        <div class="meter-card">
          <div class="label" data-i18n="machine_xl">特大型洗衣機</div>
          <div class="display">
            <span class="price">$120</span>
            <span class="unit" data-i18n="unit_wash">/ 1 次</span>
          </div>
        </div>

        <div class="meter-card">
          <div class="label" data-i18n="machine_l">大型洗衣機</div>
          <div class="display">
            <span class="price">$80</span>
            <span class="unit" data-i18n="unit_wash">/ 1 次</span>
          </div>
        </div>

        <div class="meter-card">
          <div class="label" data-i18n="machine_m">中型洗衣機</div>
          <div class="display">
            <span class="price">$60</span>
            <span class="unit" data-i18n="unit_wash">/ 1 次</span>
          </div>
        </div>

        <div class="meter-card">
          <div class="label" data-i18n="machine_dryer">烘衣機</div>
          <div class="display">
            <span class="price">$10</span>
            <span class="unit" data-i18n="unit_6min">/ 6 分鐘</span>
          </div>
        </div>
      </div>

      <p class="note-line" data-i18n="fees_note">※依現場收費為標準※</p>
    </section>
  </main>

  <footer>
    <p data-i18n="footer_copy">Copyright © 2025 <strong>衣博士龜山十巷店</strong> All rights reserved.</p>
  </footer>

  <script>
    function toggleMenu() {
      const nav = document.getElementById('nav-menu');
      const btn = document.querySelector('.menu-toggle');
      nav.classList.toggle('active');
      btn.textContent = nav.classList.contains('active') ? '✖' : '☰';
    }
  </script>
  <script src="i18n.js"></script>
</body>
</html>
